<!doctype html>
<html><head><meta charset="utf-8"><title>Sweet Home Reset Cinematic</title>
<style>
@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format('woff2');font-weight:700}
@font-face{font-family:Cormorant;src:url(../fonts/cormorant.woff2) format('woff2');font-weight:600}
@font-face{font-family:CormorantI;src:url(../fonts/cormorant_italic.woff2) format('woff2');font-weight:600}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../lib/kit.js"></script>
<script>
// Cinematic trailer: every shot is drawn by draw(t). Times are in seconds; the music (music.py) uses the same marks.
const DURATION = 55;
// ================= SHOTS =================
const lightsAll = v => [v, v, v, v, v];

// 0–12: Hollowfern sparkled, then the colour drained away
function shotTown(t) {
  const drain = smooth(seg(t, 6.6, 10.5));
  LOOK.sat = 1 - drain * .92; LOOK.bright = 1 - drain * .3; LOOK.night = 0; LOOK.warm = .35 * (1 - drain);
  cam.z = lerp(.78, .98, easeInOut(seg(t, 0, 12))); cam.x = lerp(1180, 1420, easeInOut(seg(t, 0, 12))); cam.y = lerp(780, 1000, easeInOut(seg(t, 0, 12)));
  const lights = HOUSES.map((h, i) => 1 - seg(t, 7.2 + i * .5, 7.5 + i * .5));
  drawTown(t, { night: 0, lights, lamps: 0, fountain: 1 - seg(t, 8.2, 9.8), water: 1 - seg(t, 8.0, 9.6), lighthouse: 1 - seg(t, 9.0, 10.4), season: 'summer', smoke: 1 - drain });
  fog(t, drain * .9);
  rain(t, seg(t, 9.6, 11));
  if (drain < 1) bokeh(t, (1 - drain) * .45);
  motes(t, (1 - drain) * .8, 3);
  scrim(.55); scrim(.45, false);
  cine('Once, the little town', W / 2, 330, 84, fade(t, .8, 5.6, .9));
  cine('of Hollowfern sparkled.', W / 2, 430, 84, fade(t, 1.3, 5.6, .9));
  cine('Then everyone got', W / 2, 330, 80, fade(t, 6.4, 11.6, .9), { color: '#e8e4ee', glow: 'rgba(200,210,255,.4)' });
  cine('a little too busy…', W / 2, 430, 80, fade(t, 7.0, 11.6, .9), { color: '#e8e4ee', glow: 'rgba(200,210,255,.4)' });
  cine('and the colour slowly faded.', W / 2, 1640, 70, fade(t, 9.0, 11.6, .9), { color: '#d8d4e0', glow: 'rgba(200,210,255,.3)' });
}

// 12–19: Puff gathers from what the town let fall
function shotBirth(t) {
  const lt = t - 12;
  LOOK.sat = .15; LOOK.bright = .8; LOOK.night = .6; LOOK.warm = 0;
  const z = 1 + .14 * easeInOut(seg(t, 12, 19));
  ctx.fillStyle = '#121423'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 1150); ctx.scale(z, z); ctx.translate(-W / 2, -1150);
  // close-up of the fountain rim: big stones, still dark water behind
  ctx.fillStyle = '#1e2640'; ctx.fillRect(0, 0, W, 1050);
  for (let k = 0; k < 6; k++) { ctx.strokeStyle = `rgba(120,140,190,${.12 + .05 * Math.sin(t + k)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(540, 760, 200 + k * 140 + Math.sin(t * .8 + k) * 10, 40 + k * 26, 0, 0, 7); ctx.stroke(); }
  ctx.fillStyle = '#4a4a62'; ctx.beginPath(); ctx.moveTo(-100, 1100); ctx.quadraticCurveTo(540, 960, 1180, 1100); ctx.lineTo(1180, 2000); ctx.lineTo(-100, 2000); ctx.fill();
  const r = rng(12);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = i % 2 ? '#5a5a74' : '#525269'; rr(-60 + i * 140, 1060 + Math.abs(i - 4) * 14, 132, 110, 22); ctx.fill(); }
  ctx.fillStyle = '#3a3a50'; ctx.fillRect(-100, 1180, 1300, 900);
  for (let i = 0; i < 40; i++) { ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.beginPath(); ctx.arc(r() * W, 1200 + r() * 700, 20 + r() * 60, 0, 7); ctx.fill(); }
  // forgotten things on the rim
  spr('item_sock', 0, 260, 1120, 2.2, { grey: true, rot: -.4, alpha: 1 - seg(t, 14.2, 15.2) });
  spr('item_pin', 0, 820, 1110, 2, { grey: true, rot: .3, alpha: 1 - seg(t, 14.6, 15.6) });
  ctx.restore();
  // drifting fluff, threads and the last sparkle spiral together
  const cx = 540, cy = 1050, gather = easeIn(seg(t, 13.6, 17.2));
  const rp = rng(44);
  for (let i = 0; i < 90; i++) {
    const a0 = rp() * 6.283, d0 = 250 + rp() * 650, sp = .2 + rp() * .4, kind = i % 3;
    const ang = a0 + t * sp + gather * 6, d = d0 * (1 - gather) + 8;
    const x = cx + Math.cos(ang) * d, y = cy + Math.sin(ang) * d * .8 + Math.sin(t + i) * 20 * (1 - gather);
    const al = (.45 + .5 * Math.sin(t * 2 + i)) * (t < 17.3 ? 1 : 0);
    if (kind === 0) { ctx.fillStyle = `rgba(230,226,236,${al * .8})`; ctx.beginPath(); ctx.arc(x, y, 6 + rp() * 10, 0, 7); ctx.fill(); }
    if (kind === 1) { ctx.strokeStyle = `rgba(${['255,150,180', '150,200,255', '255,220,120'][i % 3]},${al})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 12, ang, ang + 2.4); ctx.stroke(); }
    if (kind === 2) star(x, y, 8 + 10 * gather, `rgba(255,244,200,${al})`, t * 2 + i);
  }
  glow(cx, cy, 160 + 520 * gather, GOLD, .15 + .7 * gather * (t < 17.3 ? 1 : 0));
  // the flash, then Puff
  if (t > 17.3) {
    const d = t - 17.3;
    glow(cx, cy + 40, 700, GOLD, Math.max(0, .9 - d * .8));
    const s = backOut(seg(t, 17.3, 17.7)) * 2.2;
    puff(t < 18.2 ? 'closed' : 'idle', cx, 1230, s, t, { hop: [18.65] });
    if (t > 18.2 && t < 18.7) { const k = seg(t, 18.2, 18.7); star(cx + 62, 870, 40 * Math.sin(k * Math.PI), '#ffffff', k * 3); }
    for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283, k = easeOut(clamp(d / 1.2)); star(cx + Math.cos(a) * 520 * k, cy + Math.sin(a) * 420 * k, 14 * (1 - k), `rgba(255,244,200,${1 - k})`, d * 4); }
    if (d < .25) { ctx.fillStyle = `rgba(255,250,230,${(1 - d / .25) * .9})`; ctx.fillRect(0, 0, W, H); }
  }
  motes(t, .5, 8);
  cine('But from all the little things', W / 2, 330, 74, fade(t, 12.4, 16.9, .8));
  cine('the town let fall…', W / 2, 425, 74, fade(t, 13.0, 16.9, .8));
  cine('…something small woke up.', W / 2, 1640, 76, fade(t, 17.8, 18.95, .5));
}

// 19–25: the first bloom in the burrow
function shotBurrow(t) {
  const lt = t - 19;
  pc.z = lerp(2.4, 2.1, easeInOut(seg(t, 19, 22.8))) - .75 * easeInOut(seg(t, 23, 25));
  pc.x = lerp(470, 560, easeInOut(seg(t, 19, 23))); pc.y = lerp(470, 520, seg(t, 19, 25));
  const bloom = seg(t, 23.0, 24.8);
  interior('burrow', [{ x: 640, y: 620, r: easeOut(bloom) * 900, k: bloom }], 0);
  shafts(t, 414, 210, .9 * (1 - bloom * .5), -.45);
  const px = lerp(400, 570, easeInOut(seg(t, 19.3, 20.8)));
  if (bloom < .02) pspr('mess_dust', 4, 650, 630, 1.6, { grey: false, sqx: 1 + (t > 22.6 ? Math.sin(t * 50) * .05 : 0) });
  ppuff(t > 19.3 && t < 20.8 ? 'walk' : 'idle', px, 620, .55, t, { hop: [22.9] });
  const [bx, by] = P(650, 600); poof(bx, by, 23.0, t, 3, 1.6);
  motes(t, 1, 21, [0, 0, W, H]);
  // speech bubble
  const bubble = (str, a0, a1, y) => {
    const a = fade(t, a0, a1, .25); if (a <= 0) return;
    const [sx, sy] = P(px, 470);
    ctx.save(); ctx.globalAlpha = a; ctx.translate(sx, sy - y); ctx.scale(backOut(seg(t, a0, a0 + .3)), backOut(seg(t, a0, a0 + .3)));
    ctx.font = '700 64px Fredoka'; const w = ctx.measureText(str).width + 80;
    ctx.fillStyle = 'rgba(40,20,10,.3)'; rr(-w / 2 + 6, -64, w, 120, 50); ctx.fill();
    ctx.fillStyle = '#fffaf0'; rr(-w / 2, -70, w, 120, 50); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-20, 48); ctx.lineTo(0, 90); ctx.lineTo(24, 48); ctx.fill();
    ctx.fillStyle = '#4a261c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, -8);
    ctx.restore();
  };
  bubble('Ooh. Grey.', 21.0, 22.1, 0);
  bubble("Let's fix that.", 22.1, 23.0, 0);
  if (t > 23 && t < 23.3) { ctx.fillStyle = `rgba(255,250,230,${(1 - seg(t, 23, 23.3)) * .6})`; ctx.fillRect(0, 0, W, H); }
}

// 25–37: the montage
function title(str, a, y = 1660, size = 64, track = 14) { cine(str, W / 2, y, size, a, { italic: false, track }); }
const MONT_PILES = [{ x: 1000, y: 700, te: 25.5 }, { x: 1300, y: 760, te: 26.0 }, { x: 1460, y: 480, te: 26.5 }];
function montBurrow(t) {
  pc.z = 1.25; pc.x = lerp(1050, 1350, easeInOut(seg(t, 25, 27))); pc.y = 600;
  interior('burrow', MONT_PILES.map(p => ({ x: p.x, y: p.y - 20, r: easeOut(seg(t, p.te, p.te + .6)) * 260, k: seg(t, p.te, p.te + .6) })), 0);
  MONT_PILES.forEach((p, i) => { if (t < p.te) pspr('mess_dust', i * 2, p.x, p.y, 1.6); });
  const path = [[25, 900, 720], [25.45, 950, 730], [25.95, 1250, 780], [26.45, 1410, 500], [27, 1500, 520]];
  let k = path.findIndex(q => q[0] > t); k = k < 1 ? path.length - 1 : k;
  const a = path[k - 1] || path[0], b = path[k], u = easeInOut(seg(t, a[0], b[0]));
  ppuff('walk', lerp(a[1], b[1], u), lerp(a[2], b[2], u), .85, t, { hop: MONT_PILES.map(p => p.te) });
  MONT_PILES.forEach((p, i) => { const [sx, sy] = P(p.x, p.y - 40); poof(sx, sy, p.te, t, 70 + i); });
  scrim(.5, false);
  title('TIDY  HOMES', fade(t, 25.1, 26.95, .25));
}
function montBakery(t) {
  pc.z = 1.35; pc.x = 1080; pc.y = 640;
  const flood = seg(t, 28.0, 28.7);
  interior('bakery', [], easeInOut(flood), 1180, 700);
  const happy = t >= 27.6, hop = happy ? Math.abs(Math.sin((t - 27.6) * 7)) * 80 * Math.max(0, 1 - (t - 27.6) / 1.4) : 0;
  pspr(happy ? 'grumble_dust_bright' : 'grumble_dust_grumpy', happy ? Math.floor(t * 6) : 0, 1180, 770 - hop, 1.9);
  ppuff('idle', 1000, 770, .85, t, { hop: [27.6] });
  const [gx, gy] = P(1180, 700); poof(gx, gy, 27.6, t, 81, 1.2);
  if (happy) for (let i = 0; i < 5; i++) { const d = t - 27.7 - i * .18; if (d > 0 && d < 1.3) heart(gx + Math.sin(i * 2.1) * 130, gy - 160 - d * 300, 70, `rgba(255,111,156,${1 - d / 1.3})`); }
  scrim(.5, false);
  title('CHEER  UP  GRUMBLES', fade(t, 27.05, 28.95, .25));
}
function montFriends(t) {
  LOOK.sat = 1; LOOK.bright = 1; LOOK.night = .55; LOOK.warm = .1;
  cam.z = 1.05; cam.x = lerp(700, 1500, easeInOut(seg(t, 29, 31))); cam.y = 900;
  const lights = HOUSES.map((h, i) => backOut(seg(t, 29.15 + i * .3, 29.4 + i * .3)));
  drawTown(t, { night: 1, lights, lamps: 1, fountain: 0, lighthouse: 0, season: 'summer', silhouettes: true, smoke: 1 });
  layer(.75, () => HOUSES.forEach((h, i) => { const a = seg(t, 29.15 + i * .3, 29.4 + i * .3); if (a > 0) bold(h.name, h.x, 1100 - h.h - 140, 54, { alpha: a, color: '#fff4dc', scale: backOut(a) }); }));
  fall(t, 'firefly', .8, 41);
  scrim(.5, false);
  title('MAKE  FRIENDS', fade(t, 29.05, 30.95, .25));
}
function montLetter(t) {
  ctx.fillStyle = '#7a5038'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.03)'; ctx.fillRect(0, i * 170, W, 170); }
  glow(300, 400, 900, WARM, .5);
  const z = 1.0 + .12 * seg(t, 31, 33);
  ctx.save(); ctx.translate(W / 2, 960); ctx.scale(z, z); ctx.rotate(-.06);
  ctx.fillStyle = 'rgba(30,15,8,.35)'; rr(-400 + 16, -520 + 24, 800, 1040, 20); ctx.fill();
  ctx.fillStyle = '#fbf3e2'; rr(-400, -520, 800, 1040, 20); ctx.fill();
  const lines = ['Dear friend,', '', 'Maybe wipe one', 'counter of yours?', 'Or just have tea.', '', 'Both are lovely.'];
  const chars = Math.floor(seg(t, 31.1, 32.5) * lines.join('').length); let used = 0;
  ctx.font = '600 66px CormorantI'; ctx.fillStyle = '#5a3424'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  lines.forEach((ln, i) => { ctx.fillText(ln.slice(0, clamp(chars - used, 0, ln.length)), -330, -380 + i * 92); used += ln.length; });
  if (t > 32.5) { ctx.globalAlpha = seg(t, 32.5, 32.8); ctx.font = '600 80px CormorantI'; ctx.fillStyle = '#d4547c'; ctx.fillText('Puff', -200, 340); heart(-260, 316, 56, '#d4547c'); ctx.globalAlpha = 1; }
  ctx.restore();
  spr('puff_idle_down', Math.floor(t * 7), 900, 1660, 1.3);
  scrim(.6, false);
  title('AND YOUR REAL HOME, TOO', fade(t, 31.05, 32.95, .25), 1780, 50, 7);
}
const SEASONS = [['spring', 'petal', '#ffb3cc'], ['summer', 'firefly', '#ffe08a'], ['autumn', 'leaf', '#ffb070'], ['winter', 'snow', '#cfeaff']];
function montSeasons(t) {
  const i = Math.min(3, Math.floor(t - 33)), [season, fx, col] = SEASONS[i], lt = t - 33 - i;
  LOOK.sat = 1; LOOK.bright = 1; LOOK.night = i === 3 ? .45 : 0; LOOK.warm = i === 2 ? .4 : .15;
  cam.z = 1.25 - lt * .08; cam.x = [600, 1300, 1900, 1000][i] + lt * 120; cam.y = 1040;
  drawTown(t, { night: i === 3 ? 1 : 0, lights: lightsAll(i === 3 ? 1 : 0), lamps: i === 3 ? 1 : 0, fountain: .6, lighthouse: i === 3 ? 1 : 0, season, smoke: 1 });
  layer(1, () => puff('walk', cam.x - 200 + lt * 300, 1640, 1.3, t));
  fall(t, fx, 1, 300 + i);
  scrim(.5);
  cine(season.toUpperCase(), W / 2, 360, 120, Math.min(1, lt / .15) * (1 - seg(lt, .85, 1)), { italic: false, track: 24, color: '#fffaf0', glow: col });
  if (lt < .1) { ctx.fillStyle = `rgba(255,255,255,${(1 - lt / .1) * .5})`; ctx.fillRect(0, 0, W, H); }
}
function shotMontage(t) {
  if (t < 27) montBurrow(t); else if (t < 29) montBakery(t); else if (t < 31) montFriends(t); else if (t < 33) montLetter(t); else montSeasons(t);
}

// 37–46: Many paws, light work. The Glimmerwell and the lighthouse relight.
function shotClimax(t) {
  if (t < 38.5) {
    ctx.fillStyle = '#07070d'; ctx.fillRect(0, 0, W, H);
    cine('Many paws…', W / 2, 920, 120, fade(t, 37.1, 38.55, .5));
    return;
  }
  const ign = seg(t, 41.0, 42.4), wave = easeOut(seg(t, 41.0, 43.2));
  cam.z = lerp(1.2, .82, easeInOut(seg(t, 38.5, 46))); cam.x = 1300; cam.y = lerp(1180, 900, easeInOut(seg(t, 38.5, 46)));
  if (t > 41 && t < 41.6) { cam.x += Math.sin(t * 90) * 14 * (41.6 - t); cam.y += Math.cos(t * 70) * 14 * (41.6 - t); }
  const dim = t > 40.7 && t < 41 ? seg(t, 40.7, 41) : 0;
  // orbs rise from every house and drift to the gem
  const orbs = [];
  HOUSES.forEach((h, i) => {
    const k = easeInOut(seg(t, 38.7 + i * .15, 40.8));
    const hx = PX + (h.x - PX) * .75 / 1, hy = 1000;
    if (k > 0 && k < 1) orbs.push({ x: lerp(h.x, 1300, k), y: lerp(1000, 1070, k) - Math.sin(k * Math.PI) * 380, a: 1 });
  });
  { const k = easeInOut(seg(t, 39.2, 40.9)); if (k > 0 && k < 1) orbs.push({ x: lerp(2200, 1300, k), y: lerp(860, 1070, k) - Math.sin(k * Math.PI) * 300, a: 1 }); }
  const T = { night: 1, lights: lightsAll(1), lamps: 1, fountain: ign, water: seg(t, 41.1, 42), lighthouse: seg(t, 41.3, 42.2), season: 'summer', smoke: 1, orbs };
  // grey night town, with colour flooding out from the fountain
  LOOK.sat = .2; LOOK.bright = .75; LOOK.night = .7; LOOK.warm = 0;
  drawTown(t, T);
  if (wave > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(W / 2, (1100 - cam.y) * cam.z + H / 2, wave * 2400, 0, 7); ctx.clip();
    LOOK.sat = 1; LOOK.bright = 1; LOOK.night = lerp(.7, .15, wave); LOOK.warm = .25;
    drawTown(t, { ...T, night: wave > .5 ? 0 : 1 });
    ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = (1 - wave) * .8; ctx.strokeStyle = '#fff1b0'; ctx.lineWidth = 60; ctx.shadowColor = '#ffe9a0'; ctx.shadowBlur = 60;
    ctx.beginPath(); ctx.arc(W / 2, (1100 - cam.y) * cam.z + H / 2, wave * 2400, 0, 7); ctx.stroke(); ctx.restore();
  }
  // Puff at the fountain
  scrim(.35);
  layer(1, () => puff(t < 41 ? 'up' : 'idle', 1300, 1700, 1.25, t, { hop: [40.75, 41.9, 42.9, 43.9] }));
  // light pillar + rays at ignition
  if (ign > 0) {
    const [gx, gy] = [W / 2, (1070 - cam.y) * cam.z + H / 2];
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.translate(gx, gy); ctx.rotate(t * .25); ctx.globalAlpha = .28 * (1 - seg(t, 43, 46) * .6);
    for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI / 7); ctx.fillStyle = i % 2 ? '#fff3c4' : '#ffd1e0'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-110, -2000); ctx.lineTo(110, -2000); ctx.fill(); }
    ctx.restore();
    const pil = 1 - seg(t, 41.0, 42.2);
    if (pil > 0) { const g = ctx.createLinearGradient(gx - 120, 0, gx + 120, 0); g.addColorStop(0, 'rgba(255,245,200,0)'); g.addColorStop(.5, `rgba(255,250,225,${pil})`); g.addColorStop(1, 'rgba(255,245,200,0)'); ctx.fillStyle = g; ctx.fillRect(gx - 120, 0, 240, gy); }
  }
  // fireworks
  [[41.6, 260, 420], [42.1, 820, 330], [42.6, 540, 220], [43.1, 300, 560], [43.5, 780, 620], [44.0, 540, 400], [44.5, 220, 300], [44.9, 860, 460]].forEach(([te, x, y], i) => {
    const d = t - te; if (d < 0 || d > 1.5) return;
    const cols = ['#ffd84d', '#ff8fb8', '#8fe3ff', '#b8ff8f', '#ffffff'], k = easeOut(d / 1.5);
    glow(x, y, 300, GOLD, (1 - k) * .5);
    for (let j = 0; j < 30; j++) { const a = j / 30 * 6.283; ctx.save(); ctx.globalAlpha = 1 - k; star(x + Math.cos(a) * 300 * k, y + Math.sin(a) * 300 * k + 120 * k * k, 18 * (1 - k * .5), cols[(j + i) % 5], d * 5); ctx.restore(); }
  });
  motes(t, .6 + wave * .4, 13);
  if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim * .55})`; ctx.fillRect(0, 0, W, H); }
  if (t > 41 && t < 41.5) { ctx.fillStyle = `rgba(255,252,236,${(1 - seg(t, 41, 41.5))})`; ctx.fillRect(0, 0, W, H); }
  cine('…light work.', W / 2, 330, 110, fade(t, 38.6, 40.7, .4));
}

// 46–52: title
function shotTitle(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d1530'); g.addColorStop(.5, '#3a2347'); g.addColorStop(1, '#1d1530');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  bokeh(t, .8, 6, ['255,200,150', '255,160,200', '170,210,255']);
  glow(W / 2, 760, 900, 'rgba(255,190,210,A)', .35 + .1 * Math.sin(t * 2));
  // sparkles converge into the title
  const conv = easeOut(seg(t, 46.0, 46.9)), r = rng(90);
  for (let i = 0; i < 70; i++) { const a = r() * 6.283, d = (500 + r() * 700) * (1 - conv); const x = W / 2 + (r() - .5) * 800 + Math.cos(a) * d, y = 700 + (r() - .5) * 400 + Math.sin(a) * d; star(x, y, 8 + 10 * (1 - conv), `rgba(255,244,200,${1 - seg(t, 46.8, 47.3)})`, t * 3 + i); }
  const k = seg(t, 46.8, 47.5);
  if (k > 0) {
    const s = lerp(1.15, 1, easeOut(k)) + .01 * Math.sin(t * 2);
    ctx.save(); ctx.globalAlpha = k; ctx.filter = `blur(${(1 - k) * 10}px)`;
    ctx.shadowColor = 'rgba(255,190,120,.8)'; ctx.shadowBlur = 50;
    bold('Sweet Home', W / 2, 610, 170 * s, { color: '#fff7e6', stroke: '#4a2433' });
    bold('Reset', W / 2, 800, 230 * s, { color: '#ffd84d', stroke: '#4a2433' });
    ctx.restore();
    // shine sweep, masked to the letters
    const sw = seg(t, 47.6, 48.5);
    if (sw > 0 && sw < 1) {
      const main = ctx; ctx = SHINE.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
      bold('Sweet Home', W / 2, 610, 170, { lw: 0 }); bold('Reset', W / 2, 800, 230, { lw: 0 });
      ctx.globalCompositeOperation = 'source-in';
      const x = lerp(-300, W + 300, sw), g2 = ctx.createLinearGradient(x - 160, 0, x + 160, 0);
      g2.addColorStop(0, 'rgba(255,255,255,0)'); g2.addColorStop(.5, 'rgba(255,255,255,.85)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
      ctx = main; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(SHINE, 0, 0); ctx.restore();
    }
  }
  puff('idle', W / 2, 1460, 2.0 * backOut(seg(t, 47.2, 47.7)), t, { hop: [49.0, 50.5] });
  cine('One tidy spot at a time.', W / 2, 1020, 70, fade(t, 48.2, 52.2, .6));
  cine('COMING  SOON', W / 2, 1640, 58, fade(t, 49.0, 52.2, .5), { italic: false, track: 16 });
  cine('iOS  ·  Android  ·  Web', W / 2, 1720, 50, fade(t, 49.3, 52.2, .5), { italic: false, track: 6, color: '#e9dcf0' });
}

// 52–55: stinger
function shotStinger(t) {
  ctx.fillStyle = '#0b0a10'; ctx.fillRect(0, 0, W, H);
  glow(W / 2, 1150, 520, 'rgba(255,230,190,A)', .35);
  const x = lerp(1250, 540, easeOut(seg(t, 52.2, 53.0)));
  const walking = t < 53.0;
  const sneeze = t > 53.7 && t < 53.9;
  puff(walking ? 'walkL' : 'idle', x, 1300, 2.0, t, { hop: [53.75], hopH: 1.6 });
  if (t > 53.2 && t < 53.75) { spr('puff_blink_down', 1, x, 1300, 2.0 * (1 + .04 * Math.sin(t * 30))); }
  const [sx, sy] = [x, 1000]; poof(sx, sy, 53.75, t, 404, 1.3);
  if (t > 53.75) bold('pff!', x + 170, 860 - seg(t, 53.75, 54.6) * 80, 110, { scale: backOut(seg(t, 53.75, 54.0)), color: '#ffd84d', alpha: 1 - seg(t, 54.5, 54.95), rot: .15 });
}

window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  LOOK.sat = 1; LOOK.bright = 1; LOOK.night = 0; LOOK.warm = 0;
  if (t < 12) shotTown(t);
  else if (t < 19) shotBirth(t);
  else if (t < 25) shotBurrow(t);
  else if (t < 37) shotMontage(t);
  else if (t < 46) shotClimax(t);
  else if (t < 52) shotTitle(t);
  else shotStinger(t);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  vignette(.5);
  grain(t);
  dip(t, 12, .5); dip(t, 19, .4); dip(t, 25, .15, '255,255,255'); dip(t, 46, .3); dip(t, 52, .3);
  if (t < .6) { ctx.fillStyle = `rgba(0,0,0,${1 - t / .6})`; ctx.fillRect(0, 0, W, H); }
  if (t > 54.6) { ctx.fillStyle = `rgba(0,0,0,${seg(t, 54.6, 55)})`; ctx.fillRect(0, 0, W, H); }
};

window.ready = loadKit();
if (!navigator.webdriver) { const s = performance.now(); (function loop() { window.draw(((performance.now() - s) / 1000) % DURATION); requestAnimationFrame(loop); })(); }
