name: Mobile builds

# Unsigned test builds only. Nothing here signs, uploads or publishes to a store.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/web/**', 'packages/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: Also build for the iOS Simulator (uses macOS runner minutes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test --workspace @sweet-home-reset/web

      - name: Build web bundle and Android project
        working-directory: apps/web
        run: |
          npm run build:native
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sweet-home-reset-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle and iOS project
        working-directory: apps/web
        run: |
          npm run build:native
          npx cap add ios
          npx cap sync ios

      - name: Build for iOS Simulator
        working-directory: apps/web/ios/App
        run: >
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
